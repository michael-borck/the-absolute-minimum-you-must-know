name: Test docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install doc dependencies
        run: pip install pandas matplotlib beautifulsoup4
      - name: Run every python block in every doc as a doctest
        run: python scripts/test_docs.py
